name: Update garden guide

on:
  workflow_dispatch:
    inputs:
      action:
        description: "add, remove, group or calendar"
        required: true
        type: choice
        options: [add, remove, group, calendar]
      plant:
        description: "Plant name (or page name for remove/group)"
        required: false
        type: string
      group:
        description: "Group to put the plant in"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: garden-guide
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update plants and calendar
        env:
          ACTION: ${{ inputs.action }}
          PLANT: ${{ inputs.plant }}
          GROUP: ${{ inputs.group }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GARDEN_LOCATION: ${{ vars.GARDEN_LOCATION }}
        run: node garden.mjs

      - name: Commit changes
        env:
          ACTION: ${{ inputs.action }}
          PLANT: ${{ inputs.plant }}
        run: |
          git config user.name "garden-guide-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plants.json calendar.ics
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Garden guide: $ACTION $PLANT"
            git push
          fi
